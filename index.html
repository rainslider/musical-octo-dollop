<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paint and Hide - Account</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>🎨 Paint and Hide</h1><section id="login" class="card"><h2>Log in met je game-account</h2><input id="email" placeholder="E-mail"><input id="password" type="password" placeholder="Wachtwoord"><button onclick="login()">Inloggen</button><h3>Of maak een account</h3><input id="username" placeholder="Gebruikersnaam"><button onclick="register()">Account maken</button><p id="error"></p></section><section id="dashboard" class="card hidden"><h2>Mijn account</h2><p>Gebruikersnaam: <b id="name"></b></p><p>Munten: <b id="coins"></b></p><p>Uitgegeven munten: <b id="spent"></b></p><p>Premium: <b id="premium"></b></p><hr><h3>Codes</h3><input id="code" placeholder="Voer code in"><button onclick="redeem()">Inwisselen</button><p id="result"></p><button class="secondary" onclick="logout()">Uitloggen</button></section></main><script src="/app.js"></script></body></html>
